name: CI

# Proves that a fresh clone installs cleanly and the test suite passes on the
# dependency-free fallback stack (no Qdrant/LLM/network required).
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

  # Optional: verify the full extra set resolves & imports (heavier, Linux only).
  install-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (all extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: Smoke import + init
        run: |
          python -c "import knowledge, knowledge.mcp.server, knowledge.api.app"
          knowledge init --no-seed
          knowledge health
